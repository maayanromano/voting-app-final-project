name: Voting App CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "infra/**"
      - ".github/workflows/**"

  push:
    branches: [main]
    paths:
      - "services/**"
      - "infra/**"
      - ".github/workflows/**"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  checks:
    name: Terraform checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without backend
        run: terraform init -backend=false -input=false -no-color

      - name: Validate configuration
        run: terraform validate -no-color
  build:
    name: Build ${{ matrix.service }}
    needs: checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --platform linux/amd64 \
            -t "voting-${SERVICE}:${IMAGE_TAG}" \
            "services/${SERVICE}"
  plan:
    name: Plan ${{ matrix.stage }}
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        stage: [dev, prod]

    defaults:
      run:
        working-directory: infra

    env:
      STAGE: ${{ matrix.stage }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_name_prefix: ${{ vars.NAME_PREFIX }}
      TF_VAR_image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Initialize environment state
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=voting-app/${STAGE}/terraform.tfstate" \
            -backend-config="region=eu-north-1" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        run: |
          terraform plan -input=false -no-color \
            -var-file="envs/${STAGE}.tfvars"
